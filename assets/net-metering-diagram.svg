<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="auto">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#ffffff" rx="12" />

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#2563eb">How Net Metering Works</text>
  <text x="400" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#64748b">Photovoltaic Solar Example</text>

  <!-- Sun -->
  <g transform="translate(240, 130)">
    <circle cx="0" cy="0" r="32" fill="url(#sunGrad)" />
    <!-- Rays -->
    <path d="M 0 -42 L 0 -50 M 0 42 L 0 50 M -42 0 L -50 0 M 42 0 L 50 0 M -30 -30 L -36 -36 M 30 30 L 36 36 M -30 30 L -36 36 M 30 -30 L 36 -30" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Solar Panel on Roof / Standalone -->
  <g transform="translate(300, 160)">
    <polygon points="0,30 50,0 110,15 60,45" fill="url(#panelGrad)" stroke="#60a5fa" stroke-width="2"/>
    <line x1="25" y1="15" x2="85" y2="30" stroke="#93c5fd" stroke-width="1.5"/>
    <line x1="25" y1="37" x2="75" y2="7" stroke="#93c5fd" stroke-width="1.5"/>
  </g>

  <!-- Step 1 Badge & Text -->
  <circle cx="145" cy="180" r="16" fill="#2563eb"/>
  <text x="145" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#ffffff">1</text>
  <text x="170" y="174" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#1e293b">Solar panels</text>
  <text x="170" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">convert energy</text>
  <text x="170" y="204" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">from the sun</text>
  <text x="170" y="218" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">into electricity</text>

  <!-- Inverter Box -->
  <g transform="translate(295, 255)">
    <rect width="36" height="48" rx="4" fill="#334155" />
    <circle cx="18" cy="20" r="6" fill="#10b981"/>
    <rect x="8" y="32" width="20" height="4" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Step 2 Badge & Text -->
  <circle cx="135" cy="290" r="16" fill="#2563eb"/>
  <text x="135" y="296" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#ffffff">2</text>
  <text x="160" y="280" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#1e293b">An inverter converts</text>
  <text x="160" y="295" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#475569">the electricity from</text>
  <text x="160" y="309" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#475569">DC to AC for use in</text>
  <text x="160" y="323" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#475569">your home / facility</text>

  <!-- House Graphic -->
  <g transform="translate(340, 230)">
    <!-- Roof -->
    <polygon points="45,0 90,35 0,35" fill="#ea580c"/>
    <!-- House Body -->
    <rect x="10" y="35" width="70" height="55" fill="#fef08a" stroke="#eab308" stroke-width="1.5"/>
    <!-- Windows -->
    <rect x="20" y="44" width="16" height="16" fill="#93c5fd"/>
    <rect x="48" y="44" width="16" height="16" fill="#93c5fd"/>
    <!-- Door -->
    <rect x="34" y="68" width="16" height="22" fill="#9a3412"/>
  </g>

  <!-- Step 3 Badge & Text -->
  <circle cx="380" cy="180" r="16" fill="#2563eb"/>
  <text x="380" y="186" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#ffffff">3</text>
  <text x="405" y="176" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#1e293b">The energy is</text>
  <text x="405" y="192" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">used in your</text>
  <text x="405" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#475569">home or business</text>

  <!-- Bi-Directional Meter -->
  <g transform="translate(580, 240)">
    <rect x="0" y="0" width="70" height="50" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="12" y="10" width="46" height="18" rx="2" fill="#0f172a"/>
    <text x="35" y="24" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#22c55e">00842 kWh</text>
    <circle cx="20" cy="38" r="4" fill="#3b82f6"/>
    <circle cx="50" cy="38" r="4" fill="#ef4444"/>
  </g>

  <!-- Bi-directional arrows -->
  <g transform="translate(460, 255)">
    <path d="M 0 10 L 80 10" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="80,5 95,10 80,15" fill="#2563eb"/>
    <path d="M 95 25 L 15 25" stroke="#94a3b8" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="15,20 0,25 15,30" fill="#10b981"/>
    <text x="48" y="2" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Energy used in home</text>
  </g>

  <!-- Grid Electric Poles -->
  <g transform="translate(710, 180)">
    <line x1="20" y1="0" x2="20" y2="140" stroke="#334155" stroke-width="5"/>
    <line x1="-15" y1="20" x2="55" y2="20" stroke="#334155" stroke-width="4"/>
    <line x1="-5" y1="50" x2="45" y2="50" stroke="#334155" stroke-width="4"/>
    <circle cx="-15" cy="20" r="4" fill="#64748b"/>
    <circle cx="55" cy="20" r="4" fill="#64748b"/>
    <!-- Grid power lines -->
    <path d="M -15 20 Q -40 40 -80 25" stroke="#64748b" stroke-width="2" fill="none"/>
    <path d="M 55 20 Q 80 40 120 25" stroke="#64748b" stroke-width="2" fill="none"/>
  </g>

  <!-- Step 4 Badge & Text -->
  <circle cx="540" cy="330" r="16" fill="#2563eb"/>
  <text x="540" y="336" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#ffffff">4</text>
  <text x="565" y="324" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#1e293b">A bi-directional meter</text>
  <text x="565" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#475569">measures energy used</text>
  <text x="565" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#475569">and excess energy</text>
  <text x="565" y="366" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#475569">exported to grid</text>
</svg>
