<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="auto">
  <defs>
    <!-- Solar Cell Grid Pattern -->
    <pattern id="solarCoverCells" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="rotate(28)">
      <rect width="48" height="48" fill="#1e3a8a" stroke="#2563eb" stroke-width="1.5" rx="1"/>
      <line x1="24" y1="0" x2="24" y2="48" stroke="#60a5fa" stroke-width="0.8" />
      <line x1="0" y1="24" x2="48" y2="24" stroke="#60a5fa" stroke-width="0.8" />
      <line x1="12" y1="0" x2="12" y2="48" stroke="#e2e8f0" stroke-width="1.4" />
      <line x1="36" y1="0" x2="36" y2="48" stroke="#e2e8f0" stroke-width="1.4" />
    </pattern>

    <clipPath id="solarDiscClip">
      <circle cx="340" cy="270" r="210" />
    </clipPath>

    <linearGradient id="skyReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
  </defs>

  <!-- Orange/Yellow Sun Fan Lines behind the disk (Right side) -->
  <g transform="translate(340, 270)">
    <path d="M 120 -80 L 260 -80" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M 140 -40 L 290 -40" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M 150 0 L 300 0" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M 140 40 L 290 40" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M 120 80 L 260 80" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M 90 120 L 220 120" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M 50 160 L 170 160" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Main Circular Solar Panel Array -->
  <g clip-path="url(#solarDiscClip)">
    <rect x="100" y="30" width="480" height="480" fill="url(#skyReflection)" />
    <!-- Tilted Solar Module Pattern -->
    <rect x="50" y="-30" width="600" height="600" fill="url(#solarCoverCells)" opacity="0.95" transform="rotate(-18 340 270)" />
    
    <!-- Realistic Sunlight Reflection Band -->
    <path d="M 180 50 Q 350 200 520 120 L 550 250 Q 350 300 150 160 Z" fill="#ffffff" opacity="0.2" filter="blur(8px)" />
    <circle cx="440" cy="140" r="80" fill="#ffffff" opacity="0.25" filter="blur(20px)" />
    <circle cx="440" cy="140" r="18" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Clean Border Ring -->
  <circle cx="340" cy="270" r="210" fill="none" stroke="#f1f5f9" stroke-width="4" />
</svg>
